name: Hourly live trading tick

# Replaces the home-PC Windows Task Scheduler job (run_hourly.ps1) - see
# project_oracle_cloud_hosting memory / README "GitHub Actions + Supabase"
# for why: Oracle Cloud's Always Free VM creation kept hitting regional
# capacity shortages, so the bot moved to ephemeral GitHub Actions runs
# against a Supabase Postgres instead of a persistent VM.
#
# NOTE (2026-09-21): despite the filename/display name, this no longer
# actually runs on GitHub's own `schedule:` clock below - that trigger is
# kept ONLY as a free, no-cost fallback, since GitHub's `schedule:` events
# were confirmed unreliable by hours-to-days (see
# project_github_actions_cron_reliability memory). The REAL trigger is a
# Supabase pg_cron job ('hourly-tick-dispatch') that calls this workflow's
# `workflow_dispatch` REST endpoint every 15 minutes (tightened from 60min
# on 2026-09-21 to shrink the worst-case detection latency for a sharp
# price drop - the fixed -8% stop-loss can only fire when a tick actually
# runs, so a longer gap between ticks means more possible slippage past
# -8% before the bot notices). Check `SELECT * FROM cron.job;` in Supabase
# to see/change the real schedule, not this file's `cron:` line.
#
# Timed at :05, not :00, on GitHub's own advice - scheduled workflows can
# be delayed during exact-hour load spikes across all of GitHub Actions.
on:
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch: {}  # manual trigger, for testing without waiting for the clock

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - run: pip install -r requirements.txt

      - name: Refresh live data
        id: refresh
        working-directory: scripts
        env:
          POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
          POSTGRES_PORT: ${{ secrets.POSTGRES_PORT }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BYBIT_API_KEY: ${{ secrets.BYBIT_API_KEY }}
          BYBIT_API_SECRET: ${{ secrets.BYBIT_API_SECRET }}
        run: python refresh_live_data.py

      # Keeps the real-money ledger (real_executions) current: Convert
      # records plus any spot fills. Best-effort on purpose - it feeds the
      # "your real average cost / real stop" block in alerts, and a Bybit
      # hiccup there must never stop the tick from trading.
      - name: Sync real executions
        continue-on-error: true
        working-directory: scripts
        env:
          POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
          POSTGRES_PORT: ${{ secrets.POSTGRES_PORT }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
        run: python real_positions.py --days 30

      # `if: always()` on purpose (2026-09-22): when the data refresh fails
      # the job must still go red, but the trader must still RUN - it is the
      # thing that notices a stale price feed, halts trading and sends the
      # Telegram alert. Skipping it on a failed refresh would mean the one
      # failure mode that silently disables the stop-loss also silences the
      # only warning about it.
      - name: Run trader
        if: always()
        working-directory: scripts
        env:
          POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
          POSTGRES_PORT: ${{ secrets.POSTGRES_PORT }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BYBIT_API_KEY: ${{ secrets.BYBIT_API_KEY }}
          BYBIT_API_SECRET: ${{ secrets.BYBIT_API_SECRET }}
        run: python testnet_trader.py --mode simulate --no-alerts

      # The layer the user actually reads: decides from the REAL position
      # (real_executions ledger + real free balance), not the paper book.
      # Runs after the paper tick so both see the same refreshed data, and
      # only if the feed is fresh - it exits non-zero on a stale feed, but
      # the alarm for that is the trader's job, not a second message here.
      - name: Advise on the real account
        if: always()
        working-directory: scripts
        env:
          POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
          POSTGRES_PORT: ${{ secrets.POSTGRES_PORT }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python live_advisor.py
