name: Telegram on-demand advisor

# Replies to a "/invest"-style Telegram message with the strategy's current
# signal snapshot - see project_telegram_advisor_webhook memory / README for
# the full design. Separate from hourly.yml (the trading tick) so query
# latency doesn't depend on the hourly schedule.
#
# 2026-09-21: switched from a `schedule:` cron poll to a Telegram webhook.
# GitHub's `schedule:` trigger turned out to be unreliable by a large,
# inconsistent margin (confirmed via GitHub Actions run timestamps: an
# hourly cron was actually firing every 3-6h, and this job's 15min cron
# went completely silent for ~23h at one point) - not fixable by tuning the
# interval, it's a platform-level deprioritization of `schedule:` events.
# Fix: a Supabase Edge Function (supabase/functions/telegram-webhook)
# receives Telegram's webhook call the instant a message arrives, does a
# fast trigger-phrase pre-filter, and fires THIS workflow via
# `workflow_dispatch` (which GitHub does not delay/drop the way it does
# `schedule:` - confirmed near-instant in testing), passing the single
# Telegram update as the `update_json` input. This also means the bot no
# longer polls getUpdates() at all (registering a webhook with Telegram
# disables getUpdates for the bot - 409 Conflict if called), so there is no
# `schedule:` fallback anymore - Telegram's own webhook delivery (which
# retries on failure) is the reliability mechanism now, not GitHub's cron.
on:
  workflow_dispatch:
    inputs:
      update_json:
        description: "Telegram update JSON (passed by the webhook Edge Function)"
        required: false
        default: ""

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - run: pip install -r requirements.txt

      - name: Check for Telegram commands
        working-directory: scripts
        env:
          POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
          POSTGRES_PORT: ${{ secrets.POSTGRES_PORT }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BYBIT_API_KEY: ${{ secrets.BYBIT_API_KEY }}
          BYBIT_API_SECRET: ${{ secrets.BYBIT_API_SECRET }}
          BYBIT_PROXY_URL: ${{ secrets.BYBIT_PROXY_URL }}
          BYBIT_PROXY_SECRET: ${{ secrets.BYBIT_PROXY_SECRET }}
          TELEGRAM_UPDATE_JSON: ${{ github.event.inputs.update_json }}
        run: python telegram_command_handler.py
