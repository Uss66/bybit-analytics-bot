name: Telegram on-demand advisor

# Polls for a "/invest"-style Telegram message and replies with the
# strategy's current signal snapshot - see project_telegram_command_advisor
# memory / README for the full design. Separate from hourly.yml (the
# trading tick) so query latency doesn't depend on the hourly schedule.
#
# Minutes budget (private repo, 2000 free/month) - KNOWINGLY TIGHT
# (2026-09-18, user chose speed over margin after being shown the math):
# hourly.yml alone runs ~950-1000 min/month. This job's real measured
# duration is ~22-40s/run (checkout+setup+pip install dominate - the
# Python logic itself is fast, see telegram_command_handler.py's early
# "no new updates" exit). At 15min (96 runs/day, ~2880/month) that's
# ~1000-1900 min/month just for this job depending on actual per-run
# time - combined with hourly.yml this can exceed the 2000 free minutes
# some months. If GitHub starts throttling/disabling Actions for the
# month, this discretionary job must be the one that gets widened back
# (e.g. to 30min) FIRST, never let it starve the hourly trading tick.
# Watch Settings -> Billing -> Actions usage if in doubt.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - run: pip install -r requirements.txt

      - name: Check for Telegram commands
        working-directory: scripts
        env:
          POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
          POSTGRES_PORT: ${{ secrets.POSTGRES_PORT }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BYBIT_API_KEY: ${{ secrets.BYBIT_API_KEY }}
          BYBIT_API_SECRET: ${{ secrets.BYBIT_API_SECRET }}
        run: python telegram_command_handler.py
