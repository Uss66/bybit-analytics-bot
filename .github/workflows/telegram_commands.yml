name: Telegram on-demand advisor

# Polls for a "/invest"-style Telegram message and replies with the
# strategy's current signal snapshot - see project_telegram_command_advisor
# memory / README for the full design. Separate from hourly.yml (the
# trading tick) so query latency doesn't depend on the hourly schedule.
#
# Minutes budget (private repo, 2000 free/month): hourly.yml alone runs
# ~950-1000 min/month (measured ~1m20-30s/run x 720 runs). This job at a
# 30min interval (48 runs/day, ~1440/month) needs to stay well under
# ~30s/run average to leave headroom - pip caching should make repeat
# installs fast, but if minutes run tight, widen the cron interval before
# anything else (this job is the discretionary one; never let it starve
# the hourly trading tick's budget).
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - run: pip install -r requirements.txt

      - name: Check for Telegram commands
        working-directory: scripts
        env:
          POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
          POSTGRES_PORT: ${{ secrets.POSTGRES_PORT }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python telegram_command_handler.py
