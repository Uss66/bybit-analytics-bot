services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: bybit_analytics_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bybit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_local_dev}
      POSTGRES_DB: ${POSTGRES_DB:-bybit_analytics}
    ports:
      - "5432:5432"
    volumes:
      - timescale_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bybit} -d ${POSTGRES_DB:-bybit_analytics}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  timescale_data:
